name: 'Trace Python Layout Generator'

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_trace-python-layout-generator.yml'

permissions:
  contents: write
  actions: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    steps:
      - name: 'Record generator run id'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow _generate-centos7-python3-layout.yml --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          payload="$(printf '%s\n' "$run_id" | base64 -w0)"
          gh api --method PUT -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/contents/.github/python-layout-generator-run" \
            -f message='ci: record Python layout generator run id' \
            -f content="$payload" -f branch='main'
