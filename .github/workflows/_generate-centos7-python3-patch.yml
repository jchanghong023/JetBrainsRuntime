name: 'Generate CentOS 7 Python 3 Patch'

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_generate-centos7-python3-patch.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            .github

      - name: 'Generate patched workflow payloads'
        run: |
          set -euxo pipefail
          python3 .github/patch-centos7-python3.py
          mkdir -p .github/generated
          cp .github/workflows/centos7-verify.yml .github/generated/centos7-verify-python3.yml.txt
          cp .github/workflows/centos7-release.yml .github/generated/centos7-release-python3.yml.txt
          git restore .github/workflows/centos7-verify.yml .github/workflows/centos7-release.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .github/generated/centos7-verify-python3.yml.txt .github/generated/centos7-release-python3.yml.txt
          git diff --cached --check
          git commit -m 'ci: generate CentOS 7 Python 3 workflow patch payloads'
          git push origin HEAD:main
