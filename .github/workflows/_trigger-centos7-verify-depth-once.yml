name: 'Trigger CentOS 7 Verify Depth Once'

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_trigger-centos7-verify-depth-once.yml'

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: 'Dispatch and record verify run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run centos7-verify.yml --repo "$GITHUB_REPOSITORY" --ref main

          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow centos7-verify.yml \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha \
              --jq '.[] | select(.headSha == env.GITHUB_SHA) | .databaseId' \
              | head -n 1)"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 2
          done

          test -n "$run_id"
          payload="$(printf '%s\n' "$run_id" | base64 -w0)"
          gh api \
            --method PUT \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/contents/.github/last-centos7-verify-run" \
            -f message='ci: record corrected Python depth verify run id' \
            -f content="$payload" \
            -f branch='main'
