name: 'CentOS 7 Verify'

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: 'JBR source repository'
        required: true
        default: 'JetBrains/JetBrainsRuntime'
        type: string
      source_ref:
        description: 'JBR branch, tag, or commit to build'
        required: true
        default: 'jbr25'
        type: string

permissions:
  contents: read

jobs:
  build-and-verify:
    name: 'Build and verify JBR on CentOS 7'
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: 'Checkout JBR source'
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: 'Get the BootJDK'
        id: bootjdk
        uses: ./.github/actions/get-bootjdk
        with:
          platform: linux-x64

      - name: 'Install host verification tools'
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y binutils file

      - name: 'Build JBR Legacy Binary on glibc 2.17'
        env:
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          set -euxo pipefail

          docker pull quay.io/pypa/manylinux2014_x86_64:latest

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            -e BUILD_NUMBER \
            -e BOOT_JDK=/work/bootjdk/jdk \
            -e NO_SPEECHD=1 \
            quay.io/pypa/manylinux2014_x86_64:latest \
            bash -lc '
              set -euxo pipefail

              git config --global --add safe.directory /work

              yum install -y \
                alsa-lib-devel \
                autoconf \
                cups-devel \
                file \
                fontconfig-devel \
                freetype-devel \
                libX11-devel \
                libXext-devel \
                libXrandr-devel \
                libXrender-devel \
                libXt-devel \
                libXtst-devel \
                libffi-devel \
                make \
                rsync \
                unzip \
                which \
                zip

              if [[ -d /opt/rh/devtoolset-10/root/usr/bin ]]; then
                export PATH=/opt/rh/devtoolset-10/root/usr/bin:$PATH
              fi

              echo "Build libc:"
              ldd --version | head -n 1
              ldd --version | head -n 1 | grep -F "2.17"

              echo "Compiler:"
              gcc --version | head -n 1

              echo "Boot JDK:"
              "$BOOT_JDK/bin/java" -version

              bash jb/project/tools/linux/scripts/mkimages_x64.sh "$BUILD_NUMBER" lb
            '

      - name: 'Locate JBR bundles'
        id: bundles
        env:
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          set -euxo pipefail

          runtime="$(find . -maxdepth 1 -type f -name "jbr_lb-*-linux-x64-b${BUILD_NUMBER}.tar.gz" -print -quit)"
          sdk="$(find . -maxdepth 1 -type f -name "jbrsdk_lb-*-linux-x64-b${BUILD_NUMBER}.tar.gz" -print -quit)"

          test -n "$runtime"
          test -n "$sdk"

          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          echo "sdk=$sdk" >> "$GITHUB_OUTPUT"

      - name: 'Audit Linux ABI'
        env:
          RUNTIME_TGZ: ${{ steps.bundles.outputs.runtime }}
          SDK_TGZ: ${{ steps.bundles.outputs.sdk }}
        run: |
          set -euo pipefail

          rm -rf centos7-audit
          mkdir -p centos7-audit/runtime centos7-audit/sdk
          tar -xzf "$RUNTIME_TGZ" -C centos7-audit/runtime
          tar -xzf "$SDK_TGZ" -C centos7-audit/sdk

          version_gt() {
            local candidate="$1"
            local maximum="$2"
            [[ "$candidate" == "$maximum" ]] && return 1
            [[ "$(printf '%s\n%s\n' "$candidate" "$maximum" | sort -V | tail -n 1)" == "$candidate" ]]
          }

          violations=0
          elf_count=0

          while IFS= read -r -d '' f; do
            if ! file -b "$f" | grep -q '^ELF '; then
              continue
            fi

            elf_count=$((elf_count + 1))

            while IFS= read -r symbol; do
              [[ -z "$symbol" ]] && continue
              version="${symbol#GLIBC_}"
              if version_gt "$version" "2.17"; then
                echo "::error file=$f::requires $symbol (CentOS 7 maximum is GLIBC_2.17)"
                violations=1
              fi
            done < <(readelf --version-info "$f" 2>/dev/null | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sort -Vu || true)

            while IFS= read -r symbol; do
              [[ -z "$symbol" ]] && continue
              version="${symbol#GLIBCXX_}"
              if version_gt "$version" "3.4.19"; then
                echo "::error file=$f::requires $symbol (CentOS 7 system libstdc++ maximum is GLIBCXX_3.4.19)"
                violations=1
              fi
            done < <(readelf --version-info "$f" 2>/dev/null | grep -oE 'GLIBCXX_[0-9]+(\.[0-9]+)+' | sort -Vu || true)

            while IFS= read -r symbol; do
              [[ -z "$symbol" ]] && continue
              version="${symbol#CXXABI_}"
              if version_gt "$version" "1.3.7"; then
                echo "::error file=$f::requires $symbol (CentOS 7 system libstdc++ maximum is CXXABI_1.3.7)"
                violations=1
              fi
            done < <(readelf --version-info "$f" 2>/dev/null | grep -oE 'CXXABI_[0-9]+(\.[0-9]+)+' | sort -Vu || true)
          done < <(find centos7-audit -type f -print0)

          echo "Audited ELF files: $elf_count"
          test "$elf_count" -gt 0
          test "$violations" -eq 0

      - name: 'Smoke test on CentOS 7'
        env:
          RUNTIME_TGZ: ${{ steps.bundles.outputs.runtime }}
        run: |
          set -euxo pipefail

          rm -rf centos7-smoke
          mkdir -p centos7-smoke
          tar -xzf "$RUNTIME_TGZ" -C centos7-smoke
          runtime_dir="$(find "$PWD/centos7-smoke" -mindepth 1 -maxdepth 1 -type d -name 'jbr_lb-*' -print -quit)"
          test -n "$runtime_dir"

          docker pull quay.io/centos/centos:7

          docker run --rm quay.io/centos/centos:7 \
            bash -lc 'ldd --version | head -n 1 | grep -F "2.17"'

          docker run --rm \
            -v "$runtime_dir:/opt/jbr:ro" \
            quay.io/centos/centos:7 \
            /opt/jbr/bin/java -version

          docker run --rm \
            -v "$runtime_dir:/opt/jbr:ro" \
            quay.io/centos/centos:7 \
            /opt/jbr/bin/java -Xshare:on -XX:+AllowEnhancedClassRedefinition -version

      - name: 'Summary'
        env:
          RUNTIME_TGZ: ${{ steps.bundles.outputs.runtime }}
          SDK_TGZ: ${{ steps.bundles.outputs.sdk }}
        run: |
          {
            echo '### CentOS 7 JBR verification passed'
            echo
            echo "- Source: \`${{ inputs.source_repository }}@${{ inputs.source_ref }}\`"
            echo "- Source SHA: \`$(git rev-parse HEAD)\`"
            echo "- Runtime: \`$(basename "$RUNTIME_TGZ")\`"
            echo "- SDK: \`$(basename "$SDK_TGZ")\`"
            echo '- ABI gate: GLIBC <= 2.17, GLIBCXX <= 3.4.19, CXXABI <= 1.3.7'
            echo '- Runtime smoke test: CentOS 7 container'
            echo '- No workflow artifact uploaded and no GitHub Release created.'
          } >> "$GITHUB_STEP_SUMMARY"
